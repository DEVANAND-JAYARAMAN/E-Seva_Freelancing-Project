name: Credit Api Wallet
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Amount to credit to Api Wallet (TYPE#API)"
        required: true
        default: "500"

jobs:
  credit_api_wallet:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ESEVA_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ESEVA_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Credit TYPE#API wallets
        env:
          AMT: ${{ github.event.inputs.amount }}
        run: |
          set -e
          echo "Crediting Api Wallet with ₹$AMT..."
          USER_IDS=$(aws dynamodb scan --table-name Users --query "Items[*].PK.S" --output text)
          COUNT=0
          for USER_ID in $USER_IDS; do
            if [ "$USER_ID" = "None" ] || [ -z "$USER_ID" ]; then
              continue
            fi
            WALLET_PK=$(echo "$USER_ID" | sed 's/USER#/WALLET#/')
            UID_PLAIN="${USER_ID#USER#}"
            TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "API wallet: $WALLET_PK"
            aws dynamodb update-item \
              --table-name Wallets \
              --key "{\"PK\":{\"S\":\"$WALLET_PK\"},\"SK\":{\"S\":\"TYPE#API\"}}" \
              --update-expression "SET balance = if_not_exists(balance, :zero) + :amt, totalCredits = if_not_exists(totalCredits, :zero) + :amt, updatedAt = :ts, userId = if_not_exists(userId, :uid)" \
              --expression-attribute-values "{\":amt\":{\"N\":\"$AMT\"},\":zero\":{\"N\":\"0\"},\":ts\":{\"S\":\"$TS\"},\":uid\":{\"S\":\"$UID_PLAIN\"}}"
            TX_ID="TX#$(date -u +%Y%m%d%H%M%S%N)#API#MANUAL#$COUNT"
            aws dynamodb put-item \
              --table-name WalletTransactions \
              --item "{\"PK\":{\"S\":\"$WALLET_PK\"},\"SK\":{\"S\":\"$TX_ID\"},\"id\":{\"S\":\"API-MANUAL-$COUNT\"},\"amount\":{\"N\":\"$AMT\"},\"type\":{\"S\":\"credit\"},\"status\":{\"S\":\"Success\"},\"walletType\":{\"S\":\"API\"},\"description\":{\"S\":\"Manual Api Wallet credit\"},\"createdAt\":{\"S\":\"$TS\"}}"
            COUNT=$((COUNT+1))
          done
          echo "Done. Credited $COUNT Api Wallets with ₹$AMT each."

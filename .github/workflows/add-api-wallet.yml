name: Credit Api Wallet
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Amount to credit to Api Wallet (TYPE#API)"
        required: true
        default: "500"

jobs:
  credit_api_wallet:
    runs-on: ubuntu-latest
    steps:
      - name: Get EC2 IP
        run: |
          IP=$(curl -s https://daqpqxq9zg.execute-api.ap-south-1.amazonaws.com/prod/ip | jq -r .public_ip)
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      - name: Credit TYPE#API wallets on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e
            AMT="${{ github.event.inputs.amount }}"
            echo "Crediting Api Wallet with ₹$AMT for all users..."
            USER_IDS=$(aws dynamodb scan --region ap-south-1 --table-name Users --query "Items[*].PK.S" --output text)
            for USER_ID in $USER_IDS; do
              if [ "$USER_ID" = "None" ] || [ -z "$USER_ID" ]; then
                continue
              fi
              WALLET_PK=$(echo "$USER_ID" | sed 's/USER#/WALLET#/')
              echo "API wallet: $WALLET_PK"
              aws dynamodb update-item \
                --region ap-south-1 \
                --table-name Wallets \
                --key "{\"PK\":{\"S\":\"$WALLET_PK\"},\"SK\":{\"S\":\"TYPE#API\"}}" \
                --update-expression "SET balance = if_not_exists(balance, :zero) + :amt, totalCredits = if_not_exists(totalCredits, :zero) + :amt, updatedAt = :ts, userId = if_not_exists(userId, :uid)" \
                --expression-attribute-values "{\":amt\":{\"N\":\"$AMT\"},\":zero\":{\"N\":\"0\"},\":ts\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},\":uid\":{\"S\":\"${USER_ID#USER#}\"}}"
              TX_ID="TX#$(date -u +%Y%m%d%H%M%S)#API#MANUAL"
              aws dynamodb put-item \
                --region ap-south-1 \
                --table-name WalletTransactions \
                --item "{\"PK\":{\"S\":\"$WALLET_PK\"},\"SK\":{\"S\":\"$TX_ID\"},\"id\":{\"S\":\"API-MANUAL\"},\"amount\":{\"N\":\"$AMT\"},\"type\":{\"S\":\"credit\"},\"status\":{\"S\":\"Success\"},\"walletType\":{\"S\":\"API\"},\"description\":{\"S\":\"Manual Api Wallet credit\"},\"createdAt\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
            done
            echo "Done crediting Api Wallets."

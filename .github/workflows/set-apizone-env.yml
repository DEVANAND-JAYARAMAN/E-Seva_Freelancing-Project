name: Set APIZONE Env on EC2
on:
  workflow_dispatch:

jobs:
  set_env:
    runs-on: ubuntu-latest
    steps:
      - name: Get EC2 IP
        run: |
          IP=$(curl -s https://daqpqxq9zg.execute-api.ap-south-1.amazonaws.com/prod/ip | jq -r .public_ip)
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      - name: Patch .env and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e
            cd /opt/eservice/backend
            touch .env
            grep -v '^APIZONE_' .env > .env.tmp || true
            mv .env.tmp .env
            # Write key with no spaces/quotes
            printf '%s\n' "APIZONE_BASE_URL=https://kycapizone.in/api/" >> .env
            printf 'APIZONE_API_KEY=%s\n' "${{ secrets.APIZONE_API_KEY }}" >> .env
            printf 'APIZONE_MOBILE=%s\n' "${{ secrets.APIZONE_MOBILE }}" >> .env
            sed -i 's/\r$//' .env
            sed -i 's/^[[:space:]]*//' .env
            KEY_LINE=$(grep '^APIZONE_API_KEY=' .env | tail -n1)
            KEY_VAL="${KEY_LINE#APIZONE_API_KEY=}"
            KEY_LEN=${#KEY_VAL}
            if [ "$KEY_LEN" -lt 20 ]; then
              echo "ERROR: APIZONE_API_KEY missing or too short (len=$KEY_LEN). Update GitHub secret APIZONE_API_KEY first."
              exit 1
            fi
            echo "APIZONE_BASE_URL=https://kycapizone.in/api/"
            echo "APIZONE_API_KEY len=$KEY_LEN suffix=${KEY_VAL: -4}"
            MOB=$(grep '^APIZONE_MOBILE=' .env | tail -n1 | cut -d= -f2-)
            echo "APIZONE_MOBILE set=$([ -n "$MOB" ] && echo yes || echo no)"
            sudo fuser -k 8080/tcp || true
            sleep 2
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            nohup env APIZONE_BASE_URL="$APIZONE_BASE_URL" APIZONE_API_KEY="$APIZONE_API_KEY" APIZONE_MOBILE="$APIZONE_MOBILE" ./eservice-backend > ./eservice.log 2>&1 &
            sleep 3
            pgrep -af eservice-backend || (echo "FAILED to start"; tail -n 50 ./eservice.log; exit 1)
            echo "Backend restarted with APIZONE env (key len=$KEY_LEN)"
